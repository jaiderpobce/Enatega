name: food_delivery_flutter
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  graphql_flutter: ^5.1.2
  intl: ^0.19.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.7.0
  image_picker: ^1.2.3

  # To migrate the existing API layer later, keep these additions ready:
  # http: ^1.2.2
  # connectivity_plus: ^6.1.0
  # flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
